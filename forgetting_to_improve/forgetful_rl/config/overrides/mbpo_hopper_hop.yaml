# @package _global_.overrides
env: "dmc___hopper___hop"
exp_name: "mbpo_hopper_hop"
project_name: "forgetful_rl"
seed: 0
trial_length: 200  # Standard DMC episode length

# Forgetful settings
forgetful_rl: true
forgetful_rl_num_initial_samples: 100
forgetful_rl_max_iter: 500
forgetful_rl_noise_type: "joint"
forgetful_rl_max_samples: 2500
forgetful_rl_batch_optimize: true

max_model_buffer_size: 2500
num_steps: 10000  # 50 episodes × 1000 steps
epoch_length: 200
num_elites: 5
patience: 5
model_lr: 0.001
model_wd: 0.00005
model_batch_size: 256
validation_ratio: 0.0
freq_train_model: 200
effective_model_rollouts_per_step: 100
rollout_batch_size: 1000
rollout_schedule: [1, 15, 1, 1]
num_sac_updates_per_step: 10
sac_updates_every_steps: 1
num_epochs_to_retain_sac_buffer: 1

sac_gamma: 0.99
sac_tau: 0.005
sac_alpha: 0.2
sac_policy: "Gaussian"
sac_target_update_interval: 5
sac_automatic_entropy_tuning: true
sac_target_entropy: null
sac_hidden_size: 256
sac_lr: 0.0003
sac_batch_size: 256
