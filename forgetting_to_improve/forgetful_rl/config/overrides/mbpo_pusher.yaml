# @package _group_
env: "pets_pusher"
exp_name: "mbpo_pusher"
project_name: "forgetful_rl"
seed: 0
trial_length: 150

term_fn: "no_termination"

# Forgetful settings
forgetful_rl: false
forgetful_rl_num_initial_samples: 200  # For target region computation
forgetful_rl_max_iter: 500  # Max iterations for sample filtering
forgetful_rl_noise_type: "joint"  # Type of uncertainty: 'joint', 'epistemic', 'aleatoric'
forgetful_rl_max_samples: 10000  # Maximum samples to process (subsample if larger to avoid OOM)
forgetful_rl_batch_optimize: true  # Whether to optimize in batches (for large sample sizes)
# Whether to keep track of which samples were removed/kept during filtering.
# This can consume a lot of memory and winds up logging large tables to WandB.
store_data_removal: false

max_model_buffer_size: 10000  # Maximum size of replay buffer for model training (keeps most recent)
num_steps: 20000
epoch_length: 150
num_elites: 5
patience: 5
model_lr: 0.001
model_wd: 0.00005
model_batch_size: 256
validation_ratio: 0.01
freq_train_model: 150
effective_model_rollouts_per_step: 400
rollout_batch_size: 1000
rollout_schedule: [1, 15, 1, 1]
num_sac_updates_per_step: 20
sac_updates_every_steps: 1
num_epochs_to_retain_sac_buffer: 1

sac_gamma: 0.99
sac_tau: 0.005
sac_alpha: 0.2
sac_policy: "Gaussian"
sac_target_update_interval: 4
sac_automatic_entropy_tuning: true
sac_target_entropy: -0.05
sac_hidden_size: 256
sac_lr: 0.0003
sac_batch_size: 256