# @package _global_.overrides
env: "dmc___cartpole___swingup"
exp_name: "mbpo_cartpole_swingup"
project_name: "forgetful_rl"
seed: 0
trial_length: 1000  # Standard DMC episode length
action_repeat: 5  # Action repeat / frame-skip for DMC envs (set to 1 to disable)

# Forgetful settings
forgetful_rl: true
forgetful_rl_num_initial_samples: 100  # For target region computation
forgetful_rl_max_iter: 500  # Max iterations for sample filtering
forgetful_rl_noise_type: "joint"  # Type of uncertainty: 'joint', 'epistemic', 'aleatoric'
forgetful_rl_max_samples: 5000  # Maximum samples to process (subsample if larger to avoid OOM)
forgetful_rl_batch_optimize: true  # Whether to optimize in batches (for large sample sizes)

max_model_buffer_size: 5000  # Maximum size of replay buffer for model training (keeps most recent)
num_steps: 20000  # Total steps (50 episodes × 1000 steps)
epoch_length: 1000  # Steps per epoch (1 episode per epoch)
num_elites: 5
patience: 5
model_lr: 0.001
model_wd: 0.00005
model_batch_size: 256
validation_ratio: 0.2
freq_train_model: 1000
effective_model_rollouts_per_step: 100
rollout_batch_size: 1000
rollout_schedule: [1, 15, 1, 1]
num_sac_updates_per_step: 20
sac_updates_every_steps: 1
num_epochs_to_retain_sac_buffer: 1

sac_gamma: 0.99
sac_tau: 0.005
sac_alpha: 0.2
sac_policy: "Gaussian"
sac_target_update_interval: 4
sac_automatic_entropy_tuning: true
sac_target_entropy: -0.725
sac_hidden_size: 256
sac_lr: 0.003
sac_batch_size: 256