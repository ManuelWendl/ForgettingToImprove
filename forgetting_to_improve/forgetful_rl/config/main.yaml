defaults:
  - algorithm: mbpo
  - dynamics_model: gp_model
  - overrides: mbpo_cartpole
  - _self_

seed: ${overrides.seed}
device: "cuda:0"
evaluation_interval: 1
save_video: false
debug_mode: false

experiment: default

# Weights & Biases logging. Every run also writes its metrics to
# <run dir>/results.jsonl, which the plotting scripts read, so wandb is optional.
# offline: log locally (sync later with `wandb sync`); online: needs an account.
wandb:
  mode: offline  # online | offline | disabled
  entity: null
  project: ${overrides.project_name}

root_dir: "./exp"
hydra:
  run:
    dir: ${root_dir}/${algorithm.name}/${experiment}/${overrides.env}/${now:%Y.%m.%d}/${now:%H%M%S}

  sweep:
    dir: ${root_dir}/${algorithm.name}/${experiment}/${overrides.env}/${now:%Y.%m.%d}/${now:%H%M%S}
