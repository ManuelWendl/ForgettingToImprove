experiment:
  type: statistic
  method: [none, sequential, targetSampling, relevance_pursuit, warped_gp, heteroscedastic_gp]
  objective: twitter
  noise: [joint, aleatoric]
  # Twitter flash crash: DJIA prices on April 23, 2013 (405 one-minute points,
  # 9:30 AM - 4:14 PM). A fake tweet caused a brief crash around 1:10 PM.
  # Time and price are standardized (normalized time spans about [-1.73, 1.73]).
  # A_limits: target region (about 2:20-2:50 PM, after the crash)
  A_limits: [0.75, 1]
  # X_limits: input domain
  X_limits: [-1.5, 1.5]
  num_samples: 405       # all data points
  num_train_samples: 75  # training samples drawn from the whole domain
  num_A_samples: 80      # test points in the target region
  seed: 100              # seeds 0-99
  fixed_kernel: false
  noise_init: data_variance  # initial GP noise = var(y_train) of each seed
  show_plots: false
  feature_subset: null  # Use the single time feature
  kernel:
    - type: 'matern'
      nu: 2.5
      length_scale: 0.1
    - type: white
      noise_level: 0.2