experiment:
  type: single
  method: [none, sequential]
  objective: twitter
  noise: joint
  A_limits: [0.25, 0.9]
  X_limits: [-0.25, 1.0]
  num_samples: 405
  num_train_samples: 50
  num_A_samples: 80
  seed: 5
  fixed_kernel: true
  show_plots: true
  gamma_prior_a: 5        # concentration a
  gamma_prior_b: 0.2     # prior mean of sigma_w^2 (rate = a / mean)
  kernel:
  - type: 'matern'
    nu: 2.5
    length_scale: 0.15
  - type: white
    noise_level: 0.1
