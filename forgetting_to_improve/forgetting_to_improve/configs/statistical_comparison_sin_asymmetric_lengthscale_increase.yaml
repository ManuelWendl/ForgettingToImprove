experiment:
  type: statistic
  method: [none, sequential, targetSampling, relevance_pursuit, warped_gp, heteroscedastic_gp]
  objective: sin_asymmetric_lengthscale_increase
  noise: [joint, aleatoric]
  A_limits: [-3, 3]
  X_limits: [-10, 10]
  num_samples: 1000
  num_train_samples: 20
  num_A_samples: 50
  seed: 100  # seeds 0-99
  fixed_kernel: false
  noise_init: data_variance  # initial GP noise = var(y_train) of each seed
  show_plots: false
  kernel:
  - type: 'matern'
    length_scale: 1
    nu: 2.5
  - type: white
    noise_level: 0.1
