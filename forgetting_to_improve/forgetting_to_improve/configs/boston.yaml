experiment:
  type: statistic
  method: [none, sequential, targetSampling, relevance_pursuit, warped_gp, heteroscedastic_gp]
  objective: boston
  noise: [joint, epistemic]
  # All 13 features of Boston Housing dataset (normalized scale with StandardScaler)
  # Features: CRIM, ZN, INDUS, CHAS, NOX, RM, AGE, DIS, RAD, TAX, PTRATIO, B, LSTAT
  # Normalized data centered at 0 with std ~1, so most values in [-3, 3]
  # Target region with ~33 smooth points (selected from 8 smoothest)
  # Mean local variance: 0.0149 (extremely smooth region)
  # Target value range: [-0.472, 0.029] for smoothest points
  A_limits: [
    [ -0.417,   1.101],  # CRIM - crime rate
    [ -0.488,   2.946],  # ZN - residential land zoning
    [ -1.133,   1.016],  # INDUS - non-retail business acres
    [ -0.274,  -0.272],  # CHAS - Charles River (binary: non-river properties)
    [ -1.354,   0.219],  # NOX - nitric oxides concentration
    [ -0.822,  -0.313],  # RM - average rooms per dwelling
    [ -2.161,   0.698],  # AGE - proportion old units
    [ -0.633,   1.339],  # DIS - distance to employment centers
    [ -0.638,   1.661],  # RAD - highway accessibility index
    [ -1.094,   1.531],  # TAX - property tax rate
    [ -1.089,   1.176],  # PTRATIO - pupil-teacher ratio
    [ -0.129,   0.441],  # B - proportion of blacks
    [ -1.000,   0.436],  # LSTAT - % lower status population
  ]
  # X_limits: Full input space (covers ~99.7% of normalized data: [-3, 3] for each feature)
  X_limits: [
    [-15.0, 15.0],  # CRIM
    [-15.0, 15.0],  # ZN
    [-15.0, 15.0],  # INDUS
    [-15.0, 15.0],  # CHAS
    [-15.0, 15.0],  # NOX
    [-15.0, 15.0],  # RM
    [-15.0, 15.0],  # AGE
    [-15.0, 15.0],  # DIS
    [-15.0, 15.0],  # RAD
    [-15.0, 15.0],  # TAX
    [-15.0, 15.0],  # PTRATIO
    [-15.0, 15.0],  # B
    [-15.0, 15.0]   # LSTAT
  ]
  num_samples: 506  # Use all available data points
  num_train_samples: 40
  num_A_samples: 50
  seed: 100
  fixed_kernel: false
  show_plots: false  # No plots for multidimensional
  show_hessian: false
  feature_subset: null  # Use all features
  kernel:
    - type: 'matern'
      nu: 2.5
      length_scale: 0.1
    - type: white
      noise_level: 0.1
