experiment:
  type: statistic
  method: [none, sequential, targetSampling, relevance_pursuit, warped_gp, heteroscedastic_gp]
  objective: casp
  noise: [joint, aleatoric]
  # CASP dataset: Protein structure prediction
  # 9 features (F1-F9): Physicochemical properties of protein tertiary structures
  # Target: RMSD (Root Mean Square Deviation) from experimental structures
  # Normalized data centered at 0 with std ~1
  
  # A_limits: target region (a smooth, low-noise region containing 12 data points)
  A_limits: [
    [-1.468, -1.440],  # F1
    [-1.338, -1.312],  # F2
    [-0.509, -0.480],  # F3
    [-1.269, -1.243],  # F4
    [-1.438, -1.409],  # F5
    [-1.433, -1.406],  # F6
    [-1.122, -1.092],  # F7
    [-1.036, -1.016],  # F8
    [1.657, 1.682]     # F9
  ]
  
  # X_limits: input domain
  X_limits: [
    [-5.0, 5.0],  # F1
    [-5.0, 5.0],  # F2
    [-5.0, 5.0],  # F3
    [-5.0, 5.0],  # F4
    [-5.0, 5.0],  # F5
    [-5.0, 5.0],  # F6
    [-5.0, 5.0],  # F7
    [-5.0, 5.0],  # F8
    [-5.0, 5.0]   # F9
  ]
  
  num_samples: 45000  # data points used (random subset of the 45730)
  num_train_samples: 200  # training samples
  num_A_samples: 50      # test points in the target region
  seed: 100              # seeds 0-99
  fixed_kernel: false
  noise_init: data_variance  # initial GP noise = var(y_train) of each seed
  show_plots: false      # No plots for multidimensional data
  feature_subset: null   # Use all 9 features
  
  # Kernel configuration for GP
  kernel:
    - type: 'matern'
      nu: 2.5
      length_scale: 0.1
    - type: white
      noise_level: 1
