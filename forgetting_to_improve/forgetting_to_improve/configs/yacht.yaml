experiment:
  type: statistic
  method: [none, sequential, targetSampling, relevance_pursuit, warped_gp, heteroscedastic_gp]
  objective: yacht
  noise: [joint, aleatoric]
  # Yacht Hydrodynamics dataset: Hull geometry and resistance prediction
  # 6 features: LCB, PC, LDR, BDR, LBR, Froude number
  # Target: Residuary resistance per unit weight of displacement
  # Normalized data centered at 0 with std ~1
  
  # A_limits: target region (a smooth, low-noise region containing 21 data points)
  A_limits: [
    [-0.052, 0.160],  # LCB - Longitudinal position of center of buoyancy
    [-2.178, 1.607],  # PC - Prismatic coefficient
    [-0.529, 1.688],  # LDR - Length-displacement ratio
    [-0.716, 0.600],  # BDR - Beam-draught ratio
    [-1.086, 1.758],  # LBR - Length-beam ratio
    [-1.761, -0.967]  # Froude - Froude number
  ]
  
  # X_limits: input domain
  X_limits: [
    [-5.0, 5.0],  # LCB
    [-5.0, 5.0],  # PC
    [-5.0, 5.0],  # LDR
    [-5.0, 5.0],  # BDR
    [-5.0, 5.0],  # LBR
    [-5.0, 5.0]   # Froude
  ]
  
  num_samples: 308  # Total number of data points in Yacht dataset
  num_train_samples: 40  # training samples
  num_A_samples: 50      # test points in the target region
  seed: 100              # seeds 0-99
  fixed_kernel: false
  noise_init: data_variance  # initial GP noise = var(y_train) of each seed
  show_plots: false      # No plots for multidimensional data
  feature_subset: null   # Use all 6 features
  
  # Kernel configuration for GP
  kernel:
    - type: 'matern'
      nu: 2.5
      length_scale: 0.1
    - type: white
      noise_level: 1
