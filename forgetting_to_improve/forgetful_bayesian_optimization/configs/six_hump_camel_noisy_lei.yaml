bayes_opt:
  type: comparative
  objective: botorch_six_hump_camel
  n_seeds: 10
  init_points: 10
  n_iter: 50
  acquisition: qLogExpectedImprovement
  acquisition_params: {}
  save_results: true
  plot_results: true
  results_path: botorch_six_hump_camel_noisy_lei_statistical.txt
  sample_optimization:
    algorithm: [none, joint]
    method: sequential 
    min_samples: 5
  kernel:
    - type: matern
      nu: 2.5
      length_scale: 0.1             
  alpha: 1
  perturbation:
    type: constant
    probability: 0.1
    value: -100.0
