bayes_opt:
  # Ackley 6D BO with the last-layer linearized-Laplace (Jacobian) NN kernel.
  # The MLP is retrained on the current data every time the model is
  # re-initialized (each BO iteration, on the forgetting-filtered set).
  # Compares standard BO (none), forgetful BO (joint) and target-region filtering.
  type: comparative
  objective: botorch_ackley_6d
  n_seeds: 10
  init_points: 10
  n_iter: 50
  acquisition: qUpperConfidenceBound
  acquisition_params:
    kappa: 2.576
  save_results: true
  plot_results: true
  results_path: nn_ucb/botorch_ackley_6d_jacobian_statistical.txt
  sample_optimization:
    algorithm: [none, joint, target_region]
    method: sequential
    min_samples: 5
  kernel:
    - type: jacobian
      hidden: 32
      depth: 2
      activation: relu   # tanh | relu | gelu | silu | elu | leaky_relu | sigmoid | softplus
      last_layer: true
      epochs: 500        # MLP epochs per model re-init (every BO iteration)
      lr: 0.01
      prior_prec: 0.1    # tau; Sigma = I / tau (prior pushforward, GGN not used)
  alpha: 0.1
