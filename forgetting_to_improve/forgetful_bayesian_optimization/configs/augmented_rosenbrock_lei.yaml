bayes_opt:
  type: comparative
  objective: botorch_augmented_rosenbrock
  n_seeds: 10
  init_points: 10
  n_iter: 50
  acquisition: qLogExpectedImprovement
  acquisition_params: {}
  save_results: true
  plot_results: true
  results_path: lei/botorch_augmented_rosenbrock_lei_statistical.txt
  sample_optimization:
    algorithm: [none, joint, warped_gp, relevance_pursuit]
    method: sequential 
    min_samples: 5
  kernel:
    - type: matern
      nu: 2.5
      length_scale: 1.0             
  alpha: 0.1
